<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Yuuka slide</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
body{
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  background: #111;
}
#carousel{
  position:relative;
  width:800px;
  height:400px;
}
.item{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  transition:all 0.5s ease;
}
.item img{
  height:300px;
  border-radius:10px;
}
</style>
</head>
<body>

<div id="carousel">
  <div class="item"><img src="mykisah1.jpg"></div>
  <div class="item"><img src="mykisah2.jpg"></div>
  <div class="item"><img src="mykisah3.jpg"></div>
  <div class="item"><img src="mykisah4.jpg"></div>
  <div class="item"><img src="mykisah5.jpg"></div>
</div>

<script>
$(function(){
  var items=$('.item');
  var pos=[
    {x:-250,z:1,s:0.6,o:0.4},
    {x:-120,z:2,s:0.8,o:0.7},
    {x:0,z:3,s:1,o:1},
    {x:120,z:2,s:0.8,o:0.7},
    {x:250,z:1,s:0.6,o:0.4}
  ];
  function render(){
    items.each(function(i){
      $(this).css({
        transform:'translate(-50%,-50%) translateX('+pos[i].x+'px) scale('+pos[i].s+')',
        zIndex:pos[i].z,
        opacity:pos[i].o
      });
    });
  }
  render();
  setInterval(function(){
    pos.unshift(pos.pop());
    render();
  },2000);
});
</script>

</body>
</html>
